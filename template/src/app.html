<!doctype html>

<html lang="%lang%" dir="%dir%">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=2" />

	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<title>%sveltekit.env.PUBLIC_SITE_NAME%</title>

	<meta name="description" content="%sveltekit.env.PUBLIC_SITE_DESCRIPTION%" />

	<meta name="theme-color" content="#3b82f6" />
	<meta name="color-scheme" content="light dark" />

	<link rel="preconnect" href="https://fonts.googleapis.com" />

	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />

	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
		rel="stylesheet" />

	%sveltekit.head%

	<link id="theme-style" rel="stylesheet" href="styles/theme-light.css" />

	<script>
		(function () {
			var themeLink = document.getElementById('theme-style');

			if (localStorage.getItem('theme') === 'dark') {
				themeLink.href = themeLink.href.replace(/theme-(dark|light)\.css(?:$|\?)/, 'theme-dark.css');
			}

			// Vite (dev-mode HMR) and SvelteKit keep appending <style>/<link> tags to <head>
			// after load, which would otherwise out-rank theme-style in the cascade. Keep it
			// pinned as the last child of <head> so it always wins.
			var head = document.head;
			function pinToBottom() {
				if (head.lastElementChild !== themeLink) {
					head.appendChild(themeLink);
				}
			}
			pinToBottom();
			new MutationObserver(pinToBottom).observe(head, { childList: true });
		})();
	</script>
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
